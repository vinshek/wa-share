<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>分享服務安排表</title>
<style>
  :root {
    --paper: #eef1f0;
    --sheet: #ffffff;
    --ink: #1c2a26;
    --muted: #63726d;
    --line: #d5dedb;
    --go: #1f7a4d;
    --go-dark: #175e3b;
    --warn: #a3401c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.65 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  main {
    max-width: 560px;
    margin: 36px auto;
    padding: 28px 30px 30px;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  h1 { font-size: 1.45rem; margin: 0 0 4px; }
  .lede { color: var(--muted); font-size: .94rem; margin: 0 0 22px; }

  .files { display: grid; grid-template-columns: 136px 1fr; gap: 18px; margin-bottom: 20px; }
  .thumb {
    width: 136px; height: 190px; object-fit: cover; object-position: top;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
  }
  ul { list-style: none; margin: 0; padding: 0; font-size: .94rem; }
  li { padding: 7px 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  .size { color: var(--muted); }

  label { display: block; font-weight: bold; margin-bottom: 6px; }
  .dpi { margin-bottom: 18px; }
  select, textarea {
    font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: var(--sheet);
  }
  select { padding: 7px 9px; }
  textarea { width: 100%; min-height: 116px; padding: 10px 12px; resize: vertical; }

  .share {
    display: block; width: 100%; margin: 20px 0 10px; padding: 15px;
    font: inherit; font-size: 1.15rem; font-weight: bold;
    color: #fff; background: var(--go); border: 0; border-radius: 8px; cursor: pointer;
  }
  .share:hover { background: var(--go-dark); }
  .share[disabled] { background: #a1b4ab; cursor: default; }

  .more { display: flex; gap: 10px; flex-wrap: wrap; }
  .more button, .more a {
    flex: 1; min-width: 128px; padding: 9px; text-align: center;
    font: inherit; font-size: .92rem; color: var(--ink); text-decoration: none;
    background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  }
  .more button:hover, .more a:hover { border-color: var(--go); }

  button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid #7fc4a1; outline-offset: 2px;
  }
  #status { min-height: 1.65em; margin: 16px 0 0; font-size: .92rem; color: var(--muted); }
  #status.err { color: var(--warn); }
  [hidden] { display: none !important; }

  @media (max-width: 540px) {
    main { margin: 0; border: 0; border-radius: 0; }
    .files { grid-template-columns: 1fr; }
    .thumb { width: 100%; height: 220px; }
  }
</style>
</head>
<body>
<main>
  <h1>分享服務安排表</h1>
  <p class="lede">按下按鈕後，在 Windows 共用視窗選 WhatsApp，再選群組送出。圖片、PDF 和說明文字會一併帶入。</p>

  <div id="ready" hidden>
    <div class="files">
      <img id="thumb" class="thumb" alt="服務安排表預覽" hidden>
      <ul id="list"></ul>
    </div>

    <div class="dpi">
      <label for="dpi">圖片解析度</label>
      <select id="dpi">
        <option value="150">150 DPI（1240×1754，檔案小）</option>
        <option value="200" selected>200 DPI（1654×2339，清晰）</option>
        <option value="300">300 DPI（2480×3508，可列印）</option>
      </select>
    </div>

    <label for="text">說明文字</label>
    <textarea id="text"></textarea>

    <button id="share" class="share" type="button">分享到 WhatsApp</button>

    <div class="more">
      <button id="copy" type="button">只複製文字</button>
      <span id="downloads" class="more" style="flex:2"></span>
    </div>
  </div>

  <p id="status">正在取得檔案…</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let pdfBytes = null, baseName = '', files = [], dpiUsed = 0;

  function setStatus(msg, isErr) {
    const el = $('status');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
  }

  const fmtSize = (n) =>
    n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function copyText() {
    const text = $('text').value;
    if (!text) return false;
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) { return false; }
  }

  // PDF → JPG（與試算表的「輸出到服務安排表JPG」同一套做法）
  async function buildFiles(dpi) {
    if (dpiUsed === dpi && files.length) return;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
    const jpgs = [];

    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const vp = page.getViewport({ scale: dpi / 72 });
      const cv = document.createElement('canvas');
      cv.width = Math.round(vp.width);
      cv.height = Math.round(vp.height);
      const cx = cv.getContext('2d');
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: cx, viewport: vp }).promise;

      const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.92));
      const name = pdf.numPages > 1 ? (baseName + '-' + p + '.jpg') : (baseName + '.jpg');
      jpgs.push(new File([blob], name, { type: 'image/jpeg' }));
    }

    // 圖片放前面，WhatsApp 的預覽比較好看
    files = jpgs.concat([new File([pdfBytes.slice()], baseName + '.pdf', { type: 'application/pdf' })]);
    dpiUsed = dpi;
    renderFiles();
  }

  function renderFiles() {
    const list = $('list'), dl = $('downloads');
    list.innerHTML = '';
    dl.innerHTML = '';
    let thumbSet = false;

    files.forEach((f) => {
      const url = URL.createObjectURL(f);

      const li = document.createElement('li');
      const nameEl = document.createElement('span');
      nameEl.textContent = f.name;
      const sizeEl = document.createElement('span');
      sizeEl.className = 'size';
      sizeEl.textContent = ' ' + fmtSize(f.size);
      li.append(nameEl, sizeEl);
      list.appendChild(li);

      const a = document.createElement('a');
      a.href = url;
      a.download = f.name;
      a.textContent = '下載 ' + (f.type === 'application/pdf' ? 'PDF' : '圖片');
      dl.appendChild(a);

      if (f.type === 'image/jpeg' && !thumbSet) {
        $('thumb').src = url;
        $('thumb').hidden = false;
        thumbSet = true;
      }
    });
  }

  async function load() {
    const q = new URLSearchParams(location.search);
    const t = q.get('t'), api = q.get('api');
    if (!t || !api) {
      setStatus('網址缺少參數。請回試算表重新執行「輸出並分享到 WhatsApp」。', true);
      return;
    }

    // ★ 用 POST：未登入的請求打到 /exec 時，查詢參數會在 Google 的轉址中遺失，
    //   所以票證要放在 body 裡。content-type 用 text/plain 以避開跨網域預檢請求。
    let data;
    try {
      const res = await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ wa: 1, t: t })
      });
      const raw = await res.text();
      try {
        data = JSON.parse(raw);
      } catch (e) {
        setStatus('Apps Script 回傳的不是 JSON（多半是改了 doPost 之後忘了重新部署新版本）。', true);
        return;
      }
    } catch (e) {
      setStatus('連不上 Apps Script：' + e.message
        + '（請確認網頁應用程式的存取權設為「任何人」）', true);
      return;
    }
    if (!data.ok) { setStatus(data.error, true); return; }

    pdfBytes = b64ToBytes(data.pdfB64);
    baseName = data.name || '服務安排表';
    $('text').value = data.text || '';
    $('ready').hidden = false;

    setStatus('正在把 PDF 轉成圖片…');
    try {
      await buildFiles(parseInt($('dpi').value, 10));
    } catch (e) {
      setStatus('轉換圖片失敗：' + e.message, true);
      return;
    }

    if (!navigator.canShare || !navigator.canShare({ files })) {
      $('share').disabled = true;
      setStatus('這個瀏覽器不支援分享檔案。請用 Windows 上的 Chrome 或 Edge 開啟本頁，'
        + '或用下方按鈕下載後手動傳送。', true);
    } else {
      setStatus('檔案已就緒。');
    }
  }

  $('dpi').addEventListener('change', async () => {
    setStatus('重新產生圖片…');
    try {
      await buildFiles(parseInt($('dpi').value, 10));
      setStatus('檔案已就緒。');
    } catch (e) {
      setStatus('轉換圖片失敗：' + e.message, true);
    }
  });

  $('share').addEventListener('click', async () => {
    // 先把文字放進剪貼簿：萬一 WhatsApp 沒帶上說明欄，可直接 Ctrl+V
    const copied = await copyText();
    try {
      await navigator.share({ files: files, text: $('text').value });
      setStatus(copied
        ? '共用視窗已開啟。說明文字也複製好了，若 WhatsApp 沒帶上文字，按 Ctrl+V 貼上。'
        : '共用視窗已開啟。');
    } catch (e) {
      if (e.name === 'AbortError') setStatus('已取消分享，可再按一次按鈕。');
      else setStatus('分享失敗：' + e.name + ' — ' + e.message, true);
    }
  });

  $('copy').addEventListener('click', async () => {
    setStatus(await copyText() ? '說明文字已複製。' : '無法複製，請手動選取文字。');
  });

  load();
})();
</script>
</body>
</html>
